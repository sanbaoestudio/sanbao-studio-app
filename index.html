<title>San Bao Studio App</title>

<style>
/* Layout: una sola pantalla — logo arriba, la herramienta como puerta de entrada, lo que viene abajo */
:root {
  --night: #071014;
  --petrol: #264653;
  --orange: #ff914d;
  --cream: #f4efe4;
  --sand: #dcd2c0;
  --mute: #8fa3a8;
  --f-display: "Bricolage Grotesque", "Manrope", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night); color: var(--cream); font-family: var(--f-body);
  background-image: radial-gradient(120% 70% at 50% 0%, rgb(38 70 83 / .55) 0%, transparent 60%),
                    radial-gradient(60% 40% at 50% 100%, rgb(255 145 77 / .10) 0%, transparent 70%);
  background-attachment: fixed;
}
.screen {
  box-sizing: border-box; min-height: 100%; display: grid; grid-template-rows: 1fr auto; gap: 32px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 40px 28px;
}
main { display: grid; align-content: center; justify-items: center; gap: 40px; max-width: 560px; width: 100%; margin: 0 auto; text-align: center; }
.mark { display: grid; justify-items: center; gap: 18px; }
.mark svg { width: min(440px, 82vw); height: auto; display: block; }
.mark h1 { margin: 0; font-family: var(--f-display); font-weight: 300; font-size: clamp(20px, 5vw, 26px); letter-spacing: .32em; text-transform: uppercase; color: var(--sand); padding-left: .32em; }
.tools { display: grid; gap: 12px; width: 100%; }
.enter {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; text-align: left; text-decoration: none;
  color: var(--cream); border-radius: 22px; padding: 18px 18px 18px 22px;
  /* vidrio estilo iPhone: translúcido, con desenfoque y un leve tono naranja */
  background: linear-gradient(135deg, rgb(255 145 77 / .22), rgb(255 145 77 / .08) 55%, rgb(255 255 255 / .05));
  -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
  border: 1px solid rgb(255 255 255 / .16);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .22), inset 0 -1px 0 rgb(0 0 0 / .2), 0 18px 40px rgb(0 0 0 / .45);
  transition: transform .15s, background .15s;
}
.enter:hover { transform: translateY(-1px); background: linear-gradient(135deg, rgb(255 145 77 / .28), rgb(255 145 77 / .12) 55%, rgb(255 255 255 / .07)); }
.enter:active { transform: scale(.99); }
.enter:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }
.enter strong { display: block; font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1.1; }
.enter span { display: block; font-size: 14px; font-weight: 500; color: var(--sand); opacity: .85; margin-top: 4px; }
.enter i { font-style: normal; font-size: 20px; line-height: 1; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--orange); color: #2a1406; box-shadow: 0 4px 14px rgb(255 145 77 / .35); }
footer { text-align: center; color: var(--mute); font-size: 12.5px; max-width: 560px; margin: 0 auto; }
@media (prefers-reduced-motion: reduce) { .enter { transition: none; } }
</style>

<div class="screen">
  <main>
    <div class="mark">
      <svg id="logo" viewBox="247 763 2647 394" role="img" aria-label="San Bao"></svg>
      <h1>Studio App</h1>
    </div>
    <div class="tools">
      <a class="enter" href="sello/">
        <div><strong>Sello</strong><span>Marca de agua y formatos para redes</span></div>
        <i aria-hidden="true">→</i>
      </a>
    </div>
  </main>
  <footer>Tus fotos se procesan en el celular. No se suben a ningún lado.</footer>
</div>
